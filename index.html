<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<style>
:root{
  --bg1:#090711;--bg2:#171029;--card:rgba(28,21,49,.84);
  --text:#f8f3ff;--muted:#b9aaca;--accent:#bc7cff;--accent2:#ff79c6;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,"Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(188,124,255,.17),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(255,121,198,.12),transparent 25%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
.page{width:min(1450px,calc(100% - 28px));margin:auto;padding:50px 0 70px}
.hero{text-align:center;margin-bottom:40px}
.eyebrow{
  display:inline-block;padding:8px 14px;border:1px solid rgba(220,185,255,.2);
  border-radius:999px;color:#d9c4ee;background:rgba(255,255,255,.035);
  font-size:13px;letter-spacing:.08em;text-transform:uppercase
}
h1{
  margin:18px 0 10px;font-size:clamp(40px,7vw,80px);line-height:1;
  letter-spacing:-.05em;background:linear-gradient(100deg,#fff,#d8b8ff,#ffacd9);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{max-width:720px;margin:auto;color:var(--muted);font-size:17px;line-height:1.65}
.status{
  margin:18px auto 0;width:fit-content;padding:7px 11px;border-radius:999px;
  color:#bdaece;background:rgba(255,255,255,.04);font-size:12px
}
.center-wrap{display:flex;justify-content:center;margin-bottom:34px}
.center{
  min-width:min(430px,100%);text-align:center;padding:25px 32px;border-radius:26px;
  border:1px solid rgba(218,177,255,.4);
  background:linear-gradient(135deg,rgba(188,124,255,.2),rgba(255,121,198,.1)),rgba(20,15,37,.92);
  box-shadow:0 20px 60px rgba(0,0,0,.3)
}
.center .icon{font-size:32px}.center strong{display:block;font-size:30px;margin-top:7px}
.center small{display:block;color:#cfbce7;margin-top:5px;font-size:14px}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.group{
  overflow:hidden;border:1px solid rgba(215,177,255,.14);border-radius:24px;
  background:var(--card);backdrop-filter:blur(15px)
}
.group-head{padding:19px 20px 13px;border-bottom:1px solid rgba(255,255,255,.06)}
.group-head h2{margin:0;font-size:18px}.group-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.people{display:grid;gap:10px;padding:14px}
.person{
  display:flex;align-items:center;gap:13px;padding:12px 14px;min-height:67px;
  border:1px solid rgba(255,255,255,.055);border-radius:17px;background:rgba(255,255,255,.035)
}
.avatar{
  flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
  font-size:19px;background:linear-gradient(135deg,rgba(188,124,255,.22),rgba(255,121,198,.13))
}
.name{font-weight:700;overflow-wrap:anywhere}.role{margin-top:3px;color:var(--muted);font-size:12px}
footer{text-align:center;color:#8f819d;font-size:12px;padding-top:34px}
.error{max-width:700px;margin:30px auto;padding:18px;border:1px solid #75405b;border-radius:16px;background:#281421}
@media(max-width:1000px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.page{width:calc(100% - 18px);padding-top:28px}.groups{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">Загрузка...</div>
    <h1 id="title">Семейное древо</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="status" id="status">Загружаю family.json...</div>
  </header>

  <section id="content"></section>
  <footer id="footer"></footer>
</main>

<script>
const JSON_FILE = './family.json';
const REFRESH_MS = 30000;
let lastJSON = '';

function esc(v=''){
  return String(v).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[ch]);
}

function render(data){
  document.title = data.title || 'Семейное древо';
  document.getElementById('eyebrow').textContent = data.eyebrow || '';
  document.getElementById('title').textContent = data.title || 'Семейное древо';
  document.getElementById('subtitle').textContent = data.subtitle || '';
  document.getElementById('footer').textContent = data.footer || '';

  const center = data.center || {};
  const groups = Array.isArray(data.groups) ? data.groups : [];

  document.getElementById('content').innerHTML = `
    <div class="center-wrap">
      <div class="center">
        <div class="icon">${esc(center.icon || '💜')}</div>
        <strong>${esc(center.name || 'Я')}</strong>
        <small>${esc(center.role || '')}</small>
      </div>
    </div>
    <div class="groups">
      ${groups.map(group => `
        <article class="group">
          <div class="group-head">
            <h2>${esc(group.title)}</h2>
            <p>${esc(group.subtitle || '')}</p>
          </div>
          <div class="people">
            ${(group.people || []).map(person => `
              <div class="person">
                <div class="avatar">${esc(person.icon || '💜')}</div>
                <div>
                  <div class="name">${esc(person.name)}</div>
                  <div class="role">${esc(person.role || '')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </article>
      `).join('')}
    </div>`;
}

async function loadFamily(){
  const status = document.getElementById('status');
  try{
    const response = await fetch(`${JSON_FILE}?v=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();

    if(text !== lastJSON){
      const data = JSON.parse(text);
      render(data);
      lastJSON = text;
      status.textContent = 'Данные обновлены: ' + new Date().toLocaleTimeString('ru-RU');
    }else{
      status.textContent = 'Проверено: ' + new Date().toLocaleTimeString('ru-RU');
    }
  }catch(err){
    status.textContent = 'Не удалось загрузить family.json';
    if(!lastJSON){
      document.getElementById('content').innerHTML =
        '<div class="error">Ошибка загрузки family.json. Проверь, что файл лежит рядом с index.html и содержит корректный JSON.</div>';
    }
    console.error(err);
  }
}

loadFamily();
setInterval(loadFamily, REFRESH_MS);
</script>
</body>
</html>
